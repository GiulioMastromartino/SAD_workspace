[build-system]
requires = ["scikit-build-core>=0.9.3", "numpy>=1.24", "bsk-sdk==2.12.0", "bsk==2.12.0", "swig==4.4.1",
            "cmake<4.0,>=3.26", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "cubesat-omni-heyoka"
version = "0.1.0"
description = "Native Basilisk SysModel with runtime-composed Heyoka dynamics (any effector set)"
license = { file = "LICENSE" }
dependencies = ["bsk==2.12.0"]

[tool.scikit-build]
wheel.packages = ["omniheyoka"]
